name: PR Verification

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Services.Accounts.slnx

      - name: Build
        run: dotnet build Services.Accounts.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Services.Accounts.slnx --configuration Release --no-build --verbosity normal
